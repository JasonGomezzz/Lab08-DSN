spring:
  application:
    name: techstore
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/techstore}
    username: ${DB_USER:techstore}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
