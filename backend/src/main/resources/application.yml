spring:
  application:
    name: techstore
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/techstore}
    username: ${DB_USER:techstore}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

techstore:
  jwt:
    secreto: ${JWT_SECRET:}
    expiracion-minutos: 60
    expiracion-mfa-minutos: 5
  seguridad:
    intentos-maximos-login: 5
    bloqueo-minutos: 15
    intentos-maximos-mfa: 3
    bcrypt-costo: 12
  mfa:
    clave-cifrado: ${MFA_CLAVE_CIFRADO:}
    emisor: TechStore
